<!DOCTYPE html>
<html>
<head>
    <title>Optimized Mobile Version</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .pain-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .pain-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .mobile {
            display: none;
        }
        .emoji {
            font-size: 2em;
        }
        .combos {
            display: flex;
            flex-direction: column;
            margin: 20px 0;
        }
        .testimonials {
            position: relative;
            float: none;
            margin: 20px 0;
            padding: 10px;
            background: none;
            color: #000;
        }
        @media (max-width: 600px) {
            .pain-cards {
                grid-template-columns: 1fr;
            }
            .desktop {
                display: none;
            }
            .mobile {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Pain Management App</h1>
        <div class="pain-cards desktop">
            <div class="pain-card">
                <span class="emoji">🔊</span>
                <h3>Card 1</h3>
            </div>
            <div class="pain-card">
                <span class="emoji">🎨</span>
                <h3>Card 2</h3>
            </div>
            <div class="pain-card">
                <span class="emoji">📏</span>
                <h3>Card 3</h3>
            </div>
            <div class="pain-card">
                <span class="emoji">🔧</span>
                <h3>Card 4</h3>
            </div>
        </div>
        <div class="pain-cards mobile">
            <div class="pain-card">
                <span class="emoji">🔊</span>
                <h3>Card 1</h3>
            </div>
        </div>
        <div class="combos">
            <h2>Combos</h2>
            <div class="combo">
                <h3>Combo 1</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/t0KArEKluhs" frameborder="0" allowfullscreen></iframe>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/1N8-WumU-SM" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="combo">
                <h3>Combo 2</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/CYmIB5BoD00" frameborder="0" allowfullscreen></iframe>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/6cF9NIHDdeU" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="combo">
                <h3>Combo 3</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/AeACaN4uqK8" frameborder="0" allowfullscreen></iframe>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/smat1osQsC4" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
        <div class="testimonials">
            <h2>What Our Users Say</h2>
            <p>Testimonials floating without dark boxes.</p>
        </div>
        <svg width="100" height="100">
            <defs>
                <clipPath id="heartClip">
                    <path d="M50 91C75 72 91 57 91 36C91 23 79 12 63 12C53 12 46 21 50 30C54 21 47 12 38 12C22 12 10 23 10 36C10 57 26 72 50 91Z" />
                </clipPath>
            </defs>
            <rect width="100" height="100" fill="purple" clip-path="url(#heartClip)" />
        </svg>
    </div>
</body>
</html>
