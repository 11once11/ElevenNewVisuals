<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11ELEVEN DESIGNS</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: white;
}

/* HECHO CON AMOR */
.hecho {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
  opacity: 0.8;
}

.corazon svg {
  width: 18px;
  height: 18px;
}

/* TARJETAS */
.tarjetas {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #111;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
  font-size: 18px;
}

@media (min-width: 768px) {
  .tarjetas {
    grid-template-columns: 1fr 1fr;
  }
}

/* COMBOS */
.combos {
  padding: 20px;
}

.combo {
  margin-bottom: 50px;
}

.combo h2 {
  margin-bottom: 15px;
}

.video {
  position: relative;
  padding-bottom: 56.25%;
  margin-bottom: 15px;
}

.video iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  border: none;
}

/* TESTIMONIOS */
.testimonios {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 30px;
}

.testimonio {
  width: 250px;
  cursor: pointer;
  transition: transform 0.3s;
}

.testimonio img {
  width: 100%;
  border-radius: 12px;
}

.testimonio:hover {
  transform: scale(1.05);
}

/* expandido */
.testimonio.active {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1.4);
  z-index: 999;
}
</style>
</head>

<body>

<!-- HECHO CON AMOR -->

</div>

<!-- TARJETAS -->

    </div>

  </div>

</section>

<!-- TESTIMONIOS -->
<section class="testimonios">

<script>
document.querySelectorAll(".testimonio").forEach(el => {
  el.addEventListener("click", () => {
    el.classList.toggle("active");
  });

</body>
</html>
